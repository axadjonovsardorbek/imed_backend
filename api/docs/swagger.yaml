paths:
  /admin/{id}:
    get:
      consumes:
      - application/json
      description: Get a admin by their ID
      parameters:
      - description: Admin ID
        in: path
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AdminRes'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get admin by ID
      tags:
      - admin
  /auth/admin/login:
    post:
      consumes:
      - application/json
      description: Authenticate admin with login and password
      parameters:
      - description: Admin login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: JWT tokens
          schema:
            $ref: '#/definitions/models.TokenRes'
        "400":
          description: Invalid request payload
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Login admin
      tags:
      - auth
  /auth/password/change:
    put:
      consumes:
      - application/json
      description: Change password
      parameters:
      - description: Change password credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordBody'
      produces:
      - application/json
      responses:
        "200":
