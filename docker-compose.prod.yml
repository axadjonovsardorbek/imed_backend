version: '3.9'

services:
  migrate-road-prod:
    container_name: migrate-road-prod
    image: ghcr.io/kukymbr/goose-docker:3.23.0
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=host=postgres-imed-prod port=5432 user=postgres password=1111 dbname=imed sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres-imed-prod:
        condition: service_healthy
    networks:
      - imed-prod

  postgres-imed-prod:
    container_name: postgres-imed-prod
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: imed
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - imed_postgres_data_prod:/var/lib/postgresql/data
    # ports: []
    networks:
      - imed-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imed"]
      interval: 10s
      timeout: 3s
      retries: 10

  imed-prod:
    container_name: imed-prod
    build: .
    depends_on:
      postgres-imed-prod:
        condition: service_healthy
      redis-imed-prod:
        condition: service_healthy
      bgutil-provider-prod:
        condition: service_started
    ports:
      - "8005:8005"
    environment:
      # PO token provider: YouTube bot tekshiruvini cookies'siz o'tadi, muddati tugamaydi.
      YT_DLP_POT_BASE_URL: http://bgutil-provider-prod:4416
      # yt-dlp o'zini boot'da va har 24 soatda yangilaydi (buzilishlarning katta qismi shu bilan tuzaladi).
      YT_DLP_AUTO_UPDATE: "true"
      YT_DLP_UPDATE_INTERVAL: "86400"
      # Cookies rotatsiyasi shu volume'da saqlanadi.
      YT_DLP_COOKIES_STATE_DIR: /data/ytdlp
    networks:
      - imed-prod
    volumes:
      - ./internal/secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro
      - imed_ytdlp_state_prod:/data/ytdlp
    restart: unless-stopped

  # bgutil PO token provider — yt-dlp uchun sidecar.
  bgutil-provider-prod:
    container_name: bgutil-provider-prod
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    # ports: []  # faqat ichki tarmoq uchun, tashqariga ochish shart emas
    networks:
      - imed-prod
    restart: unless-stopped

  redis-imed-prod:
    image: redis:7
    container_name: redis-imed-prod
    # ports: []
    networks:
      - imed-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio-imed-prod:
    image: minio/minio
    container_name: minio-imed-prod
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --address ":9020" --console-address ":9021"
    volumes:
      - imed_minio_data_prod:/data
    ports: 
      - "9020:9020"
      - "9021:9021"
    networks:
      - imed-prod
    restart: unless-stopped

networks:
  imed-prod:
    driver: bridge

volumes:
  imed_postgres_data_prod:
  imed_minio_data_prod:
  imed_ytdlp_state_prod:
